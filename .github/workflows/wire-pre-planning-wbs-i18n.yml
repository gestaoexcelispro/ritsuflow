name: Wire Pre-Planning WBS i18n

on:
  push:
    branches:
      - feat/i18n-project-setup-wiring
    paths:
      - scripts/wire-pre-planning-wbs-i18n.mjs
      - .github/workflows/wire-pre-planning-wbs-i18n.yml

permissions:
  contents: write

jobs:
  wire-pre-planning-wbs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i18n-project-setup-wiring
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic Pre-Planning WBS translation wiring
        run: node scripts/wire-pre-planning-wbs-i18n.mjs
      - name: Commit generated Pre-Planning WBS wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/planning/pre-planning/PrePlanningWbsEditor.js
          if git diff --cached --quiet; then
            echo "No Pre-Planning WBS wiring changes required."
            exit 0
          fi
          git commit -m "Wire Pre-Planning WBS internationalization"
          git push
