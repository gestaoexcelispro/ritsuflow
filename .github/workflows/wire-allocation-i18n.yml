name: Wire Allocation i18n

on:
  push:
    branches:
      - feat/i18n-project-setup-wiring
    paths:
      - scripts/wire-allocation-i18n.mjs
      - .github/workflows/wire-allocation-i18n.yml

permissions:
  contents: write

jobs:
  wire-allocation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i18n-project-setup-wiring
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic Allocation translation wiring
        run: node scripts/wire-allocation-i18n.mjs
      - name: Commit generated Allocation wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/projects/setup/QuantityAllocationMatrix.js
          if git diff --cached --quiet; then
            echo "No Allocation wiring changes required."
            exit 0
          fi
          git commit -m "Wire Allocation matrix internationalization"
          git push
