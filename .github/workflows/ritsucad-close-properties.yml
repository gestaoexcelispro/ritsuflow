name: RitsuCAD close properties by default

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ritsucad-close-properties.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch RitsuCAD inspector default
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app/ritsucad/page.js')
          text = path.read_text(encoding='utf-8')
          old = """  const [\n    inspectorOpen,\n    setInspectorOpen,\n  ] =\n    useState(true)"""
          new = """  const [\n    inspectorOpen,\n    setInspectorOpen,\n  ] =\n    useState(false)"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one inspector default block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ritsucad/page.js
          git commit -m "fix(ritsucad): keep properties closed on startup"
          git push origin main
