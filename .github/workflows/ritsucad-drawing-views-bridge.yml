name: Install RitsuCAD drawing view state bridge
on:
  push:
    branches:
      - feat/ritsucad-drawing-views
    paths:
      - .github/workflows/ritsucad-drawing-views-bridge.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ritsucad-drawing-views
      - name: Install native state bridge
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/app/ritsucad/page.js')
          s = path.read_text(encoding='utf-8')

          if 'ritsucad:drawing-state-request' in s:
              print('State bridge already installed')
              raise SystemExit(0)

          anchor = '  const resetDraft = useCallback('
          pos = s.find(anchor)
          if pos < 0:
              raise RuntimeError('Could not locate resetDraft callback')

          bridge = '''  // ==========================================================
  // DRAWING VIEW STATE BRIDGE
  // ==========================================================

  useEffect(() => {
    const onRequest = (event) => {
      const requestId = event.detail?.requestId
      window.dispatchEvent(
        new CustomEvent('ritsucad:drawing-state-response', {
          detail: {
            requestId,
            state: { cadEntities, calibrationsByPage },
          },
        })
      )
    }

    const onApply = (event) => {
      const state = event.detail || {}
      const nextEntities = Array.isArray(state.cadEntities)
        ? state.cadEntities
        : []
      const nextCalibrations =
        state.calibrationsByPage &&
        typeof state.calibrationsByPage === 'object'
          ? state.calibrationsByPage
          : {}

      resetCadHistory(nextEntities)
      setCalibrationsByPage(nextCalibrations)
      setActiveTool('select')
      setSnapMarker(null)
      setOrthoTracking(null)
    }

    window.addEventListener('ritsucad:drawing-state-request', onRequest)
    window.addEventListener('ritsucad:drawing-state-apply', onApply)

    return () => {
      window.removeEventListener('ritsucad:drawing-state-request', onRequest)
      window.removeEventListener('ritsucad:drawing-state-apply', onApply)
    }
  }, [cadEntities, calibrationsByPage, resetCadHistory])

'''

          s = s[:pos] + bridge + s[pos:]
          path.write_text(s, encoding='utf-8')
          print('Installed RitsuCAD drawing view state bridge')
          PY
      - name: Commit source change
        run: |
          git config user.name "RitsuFlow Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/ritsucad/page.js
          git diff --cached --quiet && exit 0
          git commit -m "feat(ritsucad): connect native CAD state to drawing views"
          git push origin feat/ritsucad-drawing-views
