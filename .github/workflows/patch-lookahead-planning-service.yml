name: Patch Lookahead planning service boundary

on:
  push:
    branches: [feat/planning-domain-services]
    paths: [.github/workflows/patch-lookahead-planning-service.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/planning-domain-services
      - name: Patch Lookahead page
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('src/app/dashboard/planning/lookahead/page.js'); s=p.read_text(encoding='utf-8')
          a="import { supabase } from '../../../../lib/supabase';\n"; i="import { saveGroupedReadinessAssessment } from '../../../../lib/planning/readiness-assessment-service';\n"
          if i not in s:
              if s.count(a)!=1: raise RuntimeError('import anchor mismatch')
              s=s.replace(a,a+i,1)
          sm="      let assessmentSaved =\n        false;\n\n\n      try {\n"; em="\n      } catch (error) {\n\n        console.error(\n          'Grouped Koskela readiness:',"
          x=s.find(sm); y=s.find(em,x)
          if x<0 or y<0: raise RuntimeError('readiness markers not found')
          r='''      let assessmentSaved =
        false;


      try {
        const {
          assessment: savedAssessment,
          linkedConstraint: linkedConstraintData,
          constraintSyncError,
        } = await saveGroupedReadinessAssessment(supabase, {
          sheetRowId: row.id,
          category,
          status: nextStatus,
        });

        assessmentSaved = true;

        setReadiness((current) => ({
          ...current,
          [readinessKey]: {
            id: savedAssessment.id,
            sheet_row_id: savedAssessment.sheet_row_id,
            category: savedAssessment.category,
            status: savedAssessment.status,
            readiness_source: savedAssessment.readiness_source || null,
          },
        }));

        if (constraintSyncError) {
          console.error('Koskela -> Constraint Log synchronization:', constraintSyncError);
          setErrorMessage(`The Koskela assessment was saved, but the Constraint Log could not be synchronized. ${constraintSyncError.message || 'Please try again.'}`);
          return;
        }

        if (linkedConstraintData && savedAssessment.id) {
          setConstraintsByAssessment((current) => ({
            ...current,
            [savedAssessment.id]: linkedConstraintData,
          }));
        }
'''
          p.write_text(s[:x]+r+s[y:],encoding='utf-8')
          PY
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'RitsuFlow Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/dashboard/planning/lookahead/page.js
          git commit -m 'refactor(planning): route Lookahead readiness through service'
          git push origin feat/planning-domain-services
