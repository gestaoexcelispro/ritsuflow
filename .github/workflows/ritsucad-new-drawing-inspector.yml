name: RitsuCAD keep new drawing inspector closed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ritsucad-new-drawing-inspector.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep inspector closed when creating native drawing
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/app/ritsucad/page.js')
          text = path.read_text(encoding='utf-8')

          old = """    setActiveTool(\n      'draw-line'\n    )\n\n    setInspectorTab(\n      'properties'\n    )\n\n    setInspectorOpen(\n      true\n    )\n  }\n\n\n  // ==========================================================\n  // IMPORT"""

          new = """    setActiveTool(\n      'draw-line'\n    )\n\n    // Keep the CAD canvas clean. The inspector is user-controlled\n    // and must open only from an explicit Properties/Layers action.\n    setInspectorOpen(\n      false\n    )\n  }\n\n\n  // ==========================================================\n  // IMPORT"""

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one createNewDrawing inspector block, found {count}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ritsucad/page.js
          git commit -m "fix(ritsucad): keep inspector closed on new drawing"
          git push origin main
